name: Build Acode Migration APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition (androidPackageId)"
        type: choice
        default: com.foxdebug.acodefree
        options:
          - com.foxdebug.acodefree
          - com.foxdebug.acode
      fdroid:
        description: "Build F-Droid flavor"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Acode-migration (with submodules)
        uses: actions/checkout@v7
        with:
          repository: Acode-Foundation/Acode-migration
          ref: main
          submodules: recursive

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('platforms/android/**/*.gradle*', 'platforms/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Select edition
        if: github.event_name == 'workflow_dispatch'
        run: |
          jq --arg id "${{ inputs.edition }}" '.androidPackageId = $id' package.json > package.tmp
          mv package.tmp package.json

      - name: Patch missing ArrayList import (upstream bug)
        run: |
          f=platforms/android/app/src/main/java/com/foxdebug/acode/browser/Emulator.java
          if ! grep -qE '^import java\.util\.(ArrayList|\*);' "$f"; then
            sed -i '0,/^package .*;/s//&\n\nimport java.util.ArrayList;/' "$f"
          fi
          grep -n 'import java.util' "$f" || true

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK
        run: |
          if [ "${{ inputs.fdroid }}" = "true" ]; then
            npm run build -- dev apk fdroid
          else
            npm run build -- dev apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: acode-debug-apk
          path: platforms/android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
