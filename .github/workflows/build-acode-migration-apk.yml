name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition (androidPackageId)"
        type: choice
        default: com.foxdebug.acode
        options:
          - com.foxdebug.acodefree
          - com.foxdebug.acode
      fdroid:
        description: "Build F-Droid flavor"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Acode-migration (with submodules)
        uses: actions/checkout@v4
        with:
          repository: Acode-Foundation/Acode-migration
          ref: main
          submodules: recursive

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Set up Android SDK (API 37)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37 build-tools;37.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('platforms/android/**/*.gradle*', 'platforms/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Select edition
        if: github.event_name == 'workflow_dispatch'
        run: |
          jq --arg id "${{ inputs.edition }}" '.androidPackageId = $id' package.json > package.tmp
          mv package.tmp package.json

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK
        run: |
          if [ "${{ inputs.fdroid }}" = "true" ]; then
            npm run build -- dev apk fdroid
          else
            npm run build -- dev apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: acode-debug-apk
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
