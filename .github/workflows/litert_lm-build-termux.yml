name: Build LiteRT-LM (Termux-compatible, aarch64 bionic, GPU)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to build (e.g. v0.16.0)"
        default: "v0.16.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          repository: google-ai-edge/LiteRT-LM
          ref: ${{ inputs.ref }}
          lfs: true

      - name: Verify ref is a tag
        run: |
          git fetch --tags --force
          git rev-parse -q --verify "refs/tags/${{ inputs.ref }}" > /dev/null \
            || { echo "ERROR: '${{ inputs.ref }}' is not a release tag (e.g. v0.16.0)"; exit 1; }

      - name: Setup Android NDK r28b
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          link-to-sdk: false

      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bazel build --config=android_arm64 --define=litert_runtime_link_mode=dynamic //runtime/engine:litert_lm_main

      - name: Prepare files
        run: |
          mkdir work out
          cp bazel-bin/runtime/engine/litert_lm_main work/litert_lm_main
          ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip work/litert_lm_main || true
          file work/litert_lm_main
          tar -czf out/litert_lm_main-${{ inputs.ref }}-android-arm64.tar.gz -C work litert_lm_main
          cp prebuilt/android_arm64/*.so out/
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -lh out/

      - uses: actions/upload-artifact@v7
        with:
          name: litert_lm_main_termux
          path: out/

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.ref }}
          name: LiteRT-LM ${{ inputs.ref }} (Termux, android arm64)
          body: "litert_lm_main ${{ inputs.ref }} for Termux (aarch64, bionic), built with NDK r28b. Extract the tar.gz, put the binary in the same folder as the .so files (keep the .so names unchanged), and run with LD_LIBRARY_PATH set to that folder."
          files: out/*
