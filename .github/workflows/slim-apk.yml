name: Slim APKM / XAPK
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct link to .apkm or .xapk"
        required: true
      referer:
        description: "Referer (optional, auto-detected from the link)"
        required: false
      arch:
        description: "CPU split to keep"
        default: "arm64_v8a"
      dpi:
        description: "Density split to keep"
        default: "xxhdpi"
      langs:
        description: "Languages to keep (comma separated)"
        default: "en"
jobs:
  slim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install patchright
        run: |
          pip install patchright
          patchright install chrome
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Download with patchright
        env:
          URL: ${{ inputs.url }}
          REF: ${{ inputs.referer }}
        run: |
          case "$URL" in
            *apkmirror.com*) DEFAULT_REF="https://www.apkmirror.com/" ;;
            *apkpure.*|*winudf.com*) DEFAULT_REF="https://apkpure.com/" ;;
            *) DEFAULT_REF="$(echo "$URL" | cut -d/ -f1-3)/" ;;
          esac
          export REF="${REF:-$DEFAULT_REF}"

          cat > dl.py <<'EOF'
          import os, sys
          from patchright.sync_api import sync_playwright

          url, ref = os.environ["URL"], os.environ["REF"]
          with sync_playwright() as p:
              ctx = p.chromium.launch_persistent_context(
                  user_data_dir="/tmp/profile",
                  channel="chrome",
                  headless=False,
                  no_viewport=True,
                  accept_downloads=True,
              )
              page = ctx.pages[0] if ctx.pages else ctx.new_page()

              page.goto(ref, wait_until="domcontentloaded")
              page.wait_for_timeout(10000)
              print("Landing page title:", page.title())

              try:
                  with page.expect_download(timeout=300000) as d:
                      try:
                          page.goto(url)
                      except Exception:
                          pass  # "Download is starting" is expected
                  d.value.save_as("input.zip")
                  print("Saved input.zip")
              except Exception as e:
                  print("Download failed:", e)
                  print("Page title:", page.title())
                  sys.exit(1)
              finally:
                  ctx.close()
          EOF

          xvfb-run -a python dl.py
          ls -lh input.zip

      - name: Remove unneeded splits
        env:
          ARCH: ${{ inputs.arch }}
          DPI: ${{ inputs.dpi }}
          LANGS: ${{ inputs.langs }}
        run: |
          mkdir x && unzip -q input.zip -d x
          cd x
          if [ ! -f base.apk ] && [ ! -f manifest.json ] && [ ! -f info.json ]; then
            echo "Plain APK, not a bundle. Nothing to strip, passing it through untouched."
            cd ..
            cp input.zip slim.apk
            exit 0
          fi

          if [ -f manifest.json ]; then EXT=xapk; else EXT=apkm; fi

          for f in split_config.*.apk config.*.apk; do
            [ -e "$f" ] || continue
            n=${f#split_config.}; n=${n#config.}; n=${n%.apk}
            keep=0
            [ "$n" = "$ARCH" ] && keep=1
            [ "$n" = "$DPI" ] && keep=1
            for l in ${LANGS//,/ }; do [ "$n" = "$l" ] && keep=1; done
            [ $keep = 1 ] || rm "$f"
          done

          if [ -f manifest.json ]; then
            tmp=$(mktemp)
            jq --argjson files "$(ls *.apk | jq -R . | jq -s .)" \
              'if .split_apks then .split_apks |= map(select(.file as $f | $files | index($f))) else . end' \
              manifest.json > "$tmp" && mv "$tmp" manifest.json
          fi

          ls -lh
          zip -qr -9 "../slim.$EXT" .

      - run: ls -lh input.zip slim.*

      - uses: actions/upload-artifact@v7
        with:
          name: slim
          path: slim.*
          compression-level: 0
